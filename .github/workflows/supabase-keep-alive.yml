# Supabase bepul tarifi ~1 hafta faolsiz qolgan loyihani pauza qiladi.
# Bu workflow har 3 kunda products jadvalidan 1 qator o'qib, bazani faol saqlaydi.
# Kerakli repo secrets: VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY (service_role EMAS).
name: Supabase keep-alive

on:
  schedule:
    - cron: '0 3 */3 * *' # har 3 kunda, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: products jadvalidan 1 qator o'qish
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::VITE_SUPABASE_URL yoki VITE_SUPABASE_ANON_KEY secret topilmadi"
            exit 1
          fi
          body=$(curl -sS --fail-with-body --retry 3 --retry-delay 10 \
            "$SUPABASE_URL/rest/v1/products?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Javob: $body"
          if [ "$(echo "$body" | jq 'length')" -lt 1 ]; then
            echo "::error::products jadvalidan qator qaytmadi"
            exit 1
          fi
