<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1D4ED8" />
    <title>NEVO GROUP — Santexnika va qurilish mahsulotlari</title>
    <meta name="description" content="Santexnika va qurilish mahsulotlari: truba va fitinglar, zapor armatura, yong'in va elektr jihozlari. Narxlar so'mda, O'zbekiston bo'ylab yetkazib berish." />
    <link rel="canonical" href="https://nevo-group.vercel.app/" />

    <!-- Open Graph / Telegram / Facebook.
         Domen o'zgarsa: shu yerdagi https://nevo-group.vercel.app (og:*, canonical, JSON-LD) va public/robots.txt ni yangilang.
         Mahsulot havolalari uchun kartalar serverda: /p/<slug> (api/share.js). -->
    <meta property="og:site_name" content="NEVO GROUP" />
    <meta property="og:locale" content="uz_UZ" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nevo-group.vercel.app/" />
    <meta property="og:title" content="NEVO GROUP — Santexnika va qurilish mahsulotlari" />
    <meta property="og:description" content="Truba va fitinglar, zapor armatura, yong'in va elektr jihozlari. Narxlar so'mda, O'zbekiston bo'ylab yetkazib berish." />
    <meta property="og:image" content="https://nevo-group.vercel.app/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NEVO GROUP — santexnika va qurilish mahsulotlari" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NEVO GROUP — Santexnika va qurilish mahsulotlari" />
    <meta name="twitter:description" content="Truba va fitinglar, zapor armatura, yong'in va elektr jihozlari. Narxlar so'mda." />
    <meta name="twitter:image" content="https://nevo-group.vercel.app/og-image.jpg" />

    <!-- schema.org: tashkilot (Google bilim paneli / logotip uchun) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "NEVO GROUP",
        "url": "https://nevo-group.vercel.app/",
        "logo": "https://nevo-group.vercel.app/brand/nevo-logo.png"
      }
    </script>

    <!-- Favicon (scripts/make-social-images.mjs) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Supabase: katalog so'rovi uchun ulanishni oldindan ochish (URL .env'dan) -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin>
    <link rel="dns-prefetch" href="%VITE_SUPABASE_URL%">

    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Render'ni to'xtatmaydi: yuklangach stylesheet'ga aylanadi (display=swap — avval tizim shrifti) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"></noscript>

    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
